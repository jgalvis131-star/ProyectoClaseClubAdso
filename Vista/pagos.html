<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="mb-0"><i class="fas fa-cash-register me-2"></i> Registro de Pagos</h4>
                    </div>
                    <div class="card-body p-4">
                        <form class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="asociadoPago" class="form-label">Asociado</label>
                                    <select class="form-select" id="asociadoPago" required>
                                        <option value="" selected disabled>Seleccione el asociado...</option>
                                        <option value="1">Juan Pérez - 1023456789</option>
                                        <option value="2">María Gómez - 1098765432</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="conceptoPago" class="form-label">Concepto</label>
                                    <select class="form-select" id="conceptoPago" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="CuotaSostenimiento">Cuota de Sostenimiento</option>
                                        <option value="Inscripcion">Inscripción</option>
                                        <option value="AporteExtra">Aporte Extraordinario</option>
                                        <option value="Multa">Multa</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="montoPago" class="form-label">Monto ($)</label>
                                    <input type="number" class="form-control" id="montoPago" min="0" step="0.01" required placeholder="0.00">
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaPago" class="form-label">Fecha de Pago</label>
                                    <input type="date" class="form-control" id="fechaPago" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="metodoPago" class="form-label">Método de Pago</label>
                                    <select class="form-select" id="metodoPago" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="Efectivo">Efectivo</option>
                                        <option value="Transferencia">Transferencia Bancaria</option>
                                        <option value="NequiDaviplata">Nequi / Daviplata</option>
                                    </select>
                                </div>
                                <div class="col-md-12">
                                    <label for="comprobante" class="form-label">Número de Comprobante / Referencia</label>
                                    <input type="text" class="form-control" id="comprobante" placeholder="Ej. TRF-998231">
                                </div>
                                <div class="col-md-12">
                                    <label for="notasPago" class="form-label">Observaciones</label>
                                    <textarea class="form-control" id="notasPago" rows="2" placeholder="Notas adicionales del pago..."></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button class="btn btn-success w-100 py-2" type="submit"><i class="fas fa-check-circle me-2"></i> Registrar Pago</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
