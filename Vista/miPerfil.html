<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>CLUB ACERIAS - Mi Perfil</title>
    <style>
        body.bg-moderno {
            background-color: #F1F5F9;
            color: #1E293B;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Barra superior Azul Marino Profundo */
        .header-mr {
            background-color: #1E293B;
            color: #FFFFFF;
            padding: 18px 30px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
        }

        /* Tarjeta principal de datos personales */
        .card-perfil {
            background-color: #FFFFFF;
            border: none;
            border-top: 4px solid #2563EB;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
        }

        .titulo-seccion {
            color: #0F172A;
            font-weight: 700;
        }

        /* Botón principal Azul Rey */
        .btn-primario {
            background-color: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-primario:hover:not(:disabled) {
            background-color: #1D4ED8;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        /* Modal con detalle superior */
        .modal-content {
            border: none;
            border-top: 4px solid #2563EB;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.15);
        }

        .modal-header {
            border-bottom: 1px solid #E2E8F0;
        }

        .modal-title {
            color: #0F172A;
            font-weight: 700;
        }

        .form-label {
            color: #334155;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-control {
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            padding: 10px 12px;
            background-color: #F8FAFC;
            color: #0F172A;
        }

        .form-control:focus {
            background-color: #FFFFFF;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body class="bg-moderno pb-5">

    <header class="header-mr d-flex justify-content-between align-items-center gap-3 mb-4">
        <h3 class="fw-bold fs-4 mb-0">MRCLUB - Mi Perfil</h3>
        <div class="d-flex gap-2">
            <!-- Botón para abrir el modal de edición -->
            <button type="button" id="btnEditarModal" class="btn btn-primario btn-sm px-3 py-2" data-bs-toggle="modal" data-bs-target="#modalEditarPerfil" disabled>
                <i class="bi bi-pencil-square me-1"></i> Editar Perfil
            </button>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm px-3 py-2 rounded-3">
                <i class="bi bi-arrow-left me-1"></i> Volver al panel
            </a>
        </div>
    </header>

    <div class="container">
        <div class="card card-perfil p-4">
            <h4 class="fw-bold fs-5 mb-3 titulo-seccion">Datos Personales</h4>
            <hr class="mt-0 mb-3" style="border-color: #E2E8F0;">
            <div id="infoPerfil" class="row g-3">
                <p class="text-muted text-center py-4 mb-0">Cargando información del perfil...</p>
            </div>
        </div>
    </div>

    <!-- Modal de Edición de Perfil -->
    <div class="modal fade" id="modalEditarPerfil" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formEditarPerfil">
                    <div class="modal-header">
                        <h5 class="modal-title fs-5">Editar Mis Datos de Contacto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Correo Electrónico</label>
                            <input type="email" id="editEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editTelefono" class="form-label">Teléfono</label>
                            <input type="text" id="editTelefono" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editCiudad" class="form-label">Ciudad</label>
                            <input type="text" id="editCiudad" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDireccion" class="form-label">Dirección de Residencia</label>
                            <input type="text" id="editDireccion" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-secondary btn-sm rounded-3 px-3" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primario btn-sm px-3 py-2">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/perfil.js"></script>
</body>
</html>
