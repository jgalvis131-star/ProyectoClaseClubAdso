<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0"><i class="fas fa-calendar-alt me-2"></i> Registro de Actividades</h4>
                    </div>
                    <div class="card-body p-4">
                        <form class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="nombreActividad" class="form-label">Nombre de la Actividad</label>
                                    <input type="text" class="form-control" id="nombreActividad" required placeholder="Ej. Taller de Liderazgo ADSO">
                                </div>
                                <div class="col-md-6">
                                    <label for="tipoActividad" class="form-label">Tipo de Actividad</label>
                                    <select class="form-select" id="tipoActividad" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="Academica">Académica</option>
                                        <option value="Deportiva">Deportiva</option>
                                        <option value="Cultural">Cultural</option>
                                        <option value="Social">Social</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaActividad" class="form-label">Fecha</label>
                                    <input type="date" class="form-control" id="fechaActividad" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="horaInicio" class="form-label">Hora de Inicio</label>
                                    <input type="time" class="form-control" id="horaInicio" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="cupos" class="form-label">Cupos Disponibles</label>
                                    <input type="number" class="form-control" id="cupos" min="1" required placeholder="Ej. 30">
                                </div>
                                <div class="col-md-12">
                                    <label for="responsable" class="form-label">Responsable / Instructor</label>
                                    <input type="text" class="form-control" id="responsable" required placeholder="Nombre del responsable">
                                </div>
                                <div class="col-md-12">
                                    <label for="descripcion" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="descripcion" rows="3" placeholder="Detalles de la actividad..."></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button class="btn btn-primary w-100 py-2" type="submit"><i class="fas fa-save me-2"></i> Guardar Actividad</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
