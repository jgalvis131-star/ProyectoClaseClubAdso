<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS - Registro de Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.bg-moderno {
            background-color: #F1F5F9;
            color: #1E293B;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card-formulario {
            background-color: #FFFFFF;
            border: none;
            border-top: 5px solid #2563EB;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }

        .header-card-mr {
            background-color: #1E293B;
            color: #FFFFFF;
            padding: 18px 24px;
            border-bottom: 1px solid #E2E8F0;
        }

        .form-label {
            color: #334155;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            padding: 10px 14px;
            background-color: #F8FAFC;
            color: #0F172A;
            transition: all 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #FFFFFF;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-primario {
            background-color: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-primario:hover {
            background-color: #1D4ED8;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .enlace-volver {
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .enlace-volver:hover {
            color: #2563EB;
        }
    </style>
</head>
<body class="bg-moderno py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-formulario">
                    <div class="header-card-mr d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 fw-bold fs-5">
                            <i class="fas fa-cash-register me-2"></i> Registro de Pagos
                        </h4>
                        <span class="small text-light opacity-75">Club Acerías · MR Club</span>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <form class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label for="asociadoPago" class="form-label">Asociado</label>
                                    <select class="form-select" id="asociadoPago" required>
                                        <option value="" selected disabled>Seleccione el asociado...</option>
                                        <option value="1">Juan Pérez - 1023456789</option>
                                        <option value="2">María Gómez - 1098765432</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="conceptoPago" class="form-label">Concepto</label>
                                    <select class="form-select" id="conceptoPago" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="CuotaSostenimiento">Cuota de Sostenimiento</option>
                                        <option value="Inscripcion">Inscripción</option>
                                        <option value="AporteExtra">Aporte Extraordinario</option>
                                        <option value="Multa">Multa</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="montoPago" class="form-label">Monto ($)</label>
                                    <input type="number" class="form-control" id="montoPago" min="0" step="0.01" required placeholder="0.00">
                                </div>

                                <div class="col-md-6">
                                    <label for="fechaPago" class="form-label">Fecha de Pago</label>
                                    <input type="date" class="form-control" id="fechaPago" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="metodoPago" class="form-label">Método de Pago</label>
                                    <select class="form-select" id="metodoPago" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="Efectivo">Efectivo</option>
                                        <option value="Transferencia">Transferencia Bancaria</option>
                                        <option value="NequiDaviplata">Nequi / Daviplata</option>
                                    </select>
                                </div>

                                <div class="col-md-12">
                                    <label for="comprobante" class="form-label">Número de Comprobante / Referencia</label>
                                    <input type="text" class="form-control" id="comprobante" placeholder="Ej. TRF-998231">
                                </div>

                                <div class="col-md-12">
                                    <label for="notasPago" class="form-label">Observaciones</label>
                                    <textarea class="form-control" id="notasPago" rows="2" placeholder="Notas adicionales del pago..."></textarea>
                                </div>

                                <div class="col-12 mt-4">
                                    <button class="btn btn-primario w-100 py-2" type="submit">
                                        <i class="fas fa-check-circle me-2"></i> Registrar Pago
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div class="mt-4 text-center">
                            <a href="pagos.html" class="text-decoration-none enlace-volver">
                                <i class="fas fa-arrow-left me-1"></i> Volver a Pagos
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
