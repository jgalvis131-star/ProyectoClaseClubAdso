<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR CLUB - Inicio de Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #F1F5F9; /* Gris hielo suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #1E293B;
        }

        .contenedor-login {
            background-color: #FFFFFF;
            padding: 36px 32px;
            border-radius: 12px;
            border-top: 5px solid #2563EB; /* Detalle superior azul rey */
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 420px;
        }

        .subtitulo-club {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #2563EB;
            margin-bottom: 6px;
        }

        h2 {
            color: #0F172A;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 14px;
        }

        .grupo-input {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .grupo-input label {
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input {
            padding: 11px 14px;
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            font-size: 15px;
            color: #0F172A;
            background-color: #F8FAFC;
            transition: all 0.2s ease;
            outline: none;
        }

        input::placeholder {
            color: #94A3B8;
        }

        input:focus {
            background-color: #FFFFFF;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .grupo-botones {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Botón principal: Ingresar */
        button[type="submit"] {
            background-color: #2563EB;
            color: #FFFFFF;
        }

        button[type="submit"]:hover {
            background-color: #1D4ED8;
            transform: translateY(-1px);
        }

        /* Botón secundario: Limpiar Formulario */
        button[type="reset"] {
            background-color: #E2E8F0;
            color: #475569;
        }

        button[type="reset"]:hover {
            background-color: #CBD5E1;
            color: #1E293B;
        }

        /* Mensajes de error o validación desde login.js */
        #mensajeLogin {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            color: #DC2626;
        }

        #mensajeLogin:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div class="contenedor-login">
        <div class="subtitulo-club">Club Acerías · MR Club</div>
        <h2>Inicio de Sesión</h2>

        <form id="formLogin" action="../Modelos/iniciarSesion.php" method="POST">
            <div class="grupo-input">
                <label for="usuario">Usuario:</label>
                <input id="usuario" type="text" name="email" required placeholder="Ingrese su usuario">
            </div>

            <div class="grupo-input">
                <label for="contraseña">Contraseña:</label>
                <input id="contraseña" type="password" name="contraseña" required placeholder="Ingrese su contraseña">
            </div>

            <div class="grupo-botones">
                <button type="submit">Ingresar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>

            <p id="mensajeLogin" role="alert"></p>
        </form>
    </div>

    <script src="../Controladores/login.js"></script>
</body>
</html>
