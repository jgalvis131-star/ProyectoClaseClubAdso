<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asociados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-info text-dark py-3">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i> Registro de Asociados</h4>
                    </div>
                    <div class="card-body p-4">
                        <form class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="tipoDocumento" class="form-label">Tipo de Documento</label>
                                    <select class="form-select" id="tipoDocumento" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="CC">Cédula de Ciudadanía</option>
                                        <option value="TI">Tarjeta de Identidad</option>
                                        <option value="CE">Cédula de Extranjería</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="numDocumento" class="form-label">Número de Documento</label>
                                    <input type="text" class="form-control" id="numDocumento" required placeholder="Ej. 1023456789">
                                </div>
                                <div class="col-md-6">
                                    <label for="nombres" class="form-label">Nombres</label>
                                    <input type="text" class="form-control" id="nombres" required placeholder="Tus nombres">
                                </div>
                                <div class="col-md-6">
                                    <label for="apellidos" class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" id="apellidos" required placeholder="Tus apellidos">
                                </div>
                                <div class="col-md-6">
                                    <label for="correo" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="correo" required placeholder="correo@ejemplo.com">
                                </div>
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Teléfono / Celular</label>
                                    <input type="tel" class="form-control" id="telefono" required placeholder="3001234567">
                                </div>
                                <div class="col-md-12">
                                    <label for="direccion" class="form-label">Dirección de Residencia</label>
                                    <input type="text" class="form-control" id="direccion" required placeholder="Calle 123 # 45-67">
                                </div>
                                <div class="col-md-6">
                                    <label for="estadoCivil" class="form-label">Estado Civil</label>
                                    <select class="form-select" id="estadoCivil" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="Soltero">Soltero/a</option>
                                        <option value="Casado">Casado/a</option>
                                        <option value="UnionLibre">Unión Libre</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="tipoAsociado" class="form-label">Tipo de Asociado</label>
                                    <select class="form-select" id="tipoAsociado" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="Regular">Regular</option>
                                        <option value="VIP">VIP</option>
                                        <option value="Fundador">Fundador</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-4">
                                    <button class="btn btn-info text-dark fw-bold w-100 py-2" type="submit"><i class="fas fa-user-check me-2"></i> Registrar Asociado</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
