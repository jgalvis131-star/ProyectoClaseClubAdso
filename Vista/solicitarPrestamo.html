<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>CLUB ACERIAS - Solicitar Préstamo</title>
    <style>
        body.bg-moderno {
            background-color: #F1F5F9;
            color: #1E293B;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card-formulario {
            background-color: #FFFFFF;
            border: none;
            border-top: 5px solid #2563EB;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .subtitulo-club {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #2563EB;
            margin-bottom: 6px;
        }

        .titulo {
            color: #0F172A;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 14px;
        }

        .form-label {
            color: #334155;
            font-size: 0.9rem;
        }

        .form-control {
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            padding: 10px 14px;
            background-color: #F8FAFC;
            color: #0F172A;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #FFFFFF;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-primario {
            background-color: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            transition: all 0.2s ease;
        }

        .btn-primario:hover {
            background-color: #1D4ED8;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .enlace-volver {
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .enlace-volver:hover {
            color: #2563EB;
        }
    </style>
</head>
<body class="bg-moderno py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-formulario">
                    <div class="card-body p-4 p-md-5">
                        <div class="subtitulo-club">Club Acerías · MR Club</div>
                        <h2 class="text-center mb-3 fw-bold fs-4 titulo">Solicitar Préstamo</h2>
                        <p class="text-muted text-center small mb-4">
                            Máximo 3 préstamos simultáneos y un límite acumulado de $80.000.000.
                        </p>

                        <form id="formSolicitudPrestamo">
                            <div class="mb-3">
                                <label for="valorPrestamo" class="form-label fw-semibold">Valor del Préstamo ($)</label>
                                <input type="number" id="valorPrestamo" class="form-control" min="100000" step="1000" max="80000000" required placeholder="Ej: 20000000">
                            </div>

                            <div class="mb-3">
                                <label for="numeroCuotas" class="form-label fw-semibold">Número de Cuotas</label>
                                <input type="number" id="numeroCuotas" class="form-control" min="1" max="60" required placeholder="Ej: 12">
                            </div>

                            <div class="mb-4">
                                <label for="fechaPrestamo" class="form-label fw-semibold">Fecha de Solicitud</label>
                                <input type="date" id="fechaPrestamo" class="form-control" required>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primario flex-grow-1">
                                    <i class="bi bi-send me-1"></i> Enviar Solicitud
                                </button>
                            </div>
                        </form>

                        <div class="mt-4 text-center">
                            <a href="dashboard.html" class="text-decoration-none enlace-volver">
                                <i class="bi bi-arrow-left me-1"></i> Volver al Panel
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('fechaPrestamo').valueAsDate = new Date();

        document.getElementById('formSolicitudPrestamo').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = {
                valorPrestamo: Number(document.getElementById('valorPrestamo').value),
                numeroCuotas: Number(document.getElementById('numeroCuotas').value),
                fechaPrestamo: document.getElementById('fechaPrestamo').value
            };

            try {
                const respuesta = await fetch("../Modelos/gestionarPrestamos.php", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();
                if (!respuesta.ok || !resultado.success) {
                    throw new Error(resultado.message || "Error al enviar la solicitud.");
                }

                alert(resultado.message);
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("Aviso de Restricción: " + error.message);
            }
        });
    </script>
</body>
</html>
